  --ink-2: #172123;
  --ink-3: #213033;
  --paper: #f2e8d5;
  --paper-2: #e8dbc2;
  --paper-3: #dccbae;
  --gold: #b89a6c;
  --gold-soft: #dec49d;
  --gold-dim: #7c5f36;
  --red: #8e2f2a;
  --red-bright: #df8c77;
  --jade: #6f8172;
  --text: #2c2218;
  --muted: #beb8aa;
  --muted-dark: #6e5b46;
  --line: rgba(183, 138, 75, 0.28);
  --line-strong: rgba(183, 138, 75, 0.55);
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--ink);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--paper);
  font-family: var(--serif);
  background: #101719;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.22;
  background-image:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.03) 0 1px, transparent 1px 7px);
  mix-blend-mode: soft-light;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

::selection {
  background: rgba(142, 47, 42, 0.7);
  color: #fff7e8;
}

/* ---------- 通用纸张 ---------- */

.paper {
  position: relative;
  color: var(--text);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.42), transparent 34%),
    repeating-linear-gradient(0deg, rgba(92, 70, 40, 0.035) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, #eee4d1 0%, #e0d1b5 100%);
  border: 1px solid rgba(112, 82, 43, 0.4);
  box-shadow: var(--shadow);
}

.paper::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(112, 82, 43, 0.16);
  pointer-events: none;
}

.paper-inner {
  position: relative;
  z-index: 1;
}

.start-left {
  align-self: end;
  max-width: 600px;
  padding-top: clamp(180px, 39vh, 420px);
}

.kicker {
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--gold);
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.34em;
}

.kicker::before {
  content: "";
  width: 44px;
  height: 1px;
  background: var(--gold);
  opacity: 0.7;
}

.title-wrap {
  display: flex;
  align-items: end;
  gap: 16px;
  margin: 14px 0 18px;
}

.start-title {
  margin: 0;
  color: #f4e6cd;
  font-size: clamp(64px, 8.5vw, 132px);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: 0.055em;
  text-shadow: 0 4px 34px #080909;
}

.title-seal {
  flex: none;
  margin-bottom: 6px;
  padding: 6px 5px;
  border: 3px double #dd8e79;
  color: #f6c8b7;
  font-size: 11px;
  line-height: 1.35;
  letter-spacing: 0.13em;
  text-align: center;
  background: #742d28;
}

.title-seal span {
  display: block;
}

.start-sub {
  margin: 0;
  max-width: 620px;
  color: #cbbda5;
  font-size: 15px;
  line-height: 2.05;
  letter-spacing: 0.04em;
}

.start-sub strong {
  color: var(--paper);
  font-weight: 500;
}

.start-foot {
  margin: 20px 0 0;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.12em;
}

.start-card {
  position: relative;
  padding: 30px;
  background: linear-gradient(145deg, rgba(27, 36, 37, 0.97), rgba(12, 18, 19, 0.96));
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
}

.start-card::after,
.side-panel::after {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid var(--line);
  pointer-events: none;
}

.start-card .btn-primary {
  width: 100%;
}

.start-card .card-kicker {
  color: var(--red-bright);
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.24em;
  margin-bottom: 20px;
}

.start-card h2 {
  margin: 0 0 18px;
  font-size: clamp(28px, 3.4vw, 42px);
  font-weight: 500;
  letter-spacing: 0.08em;
}

.start-card p {
  margin: 0 0 14px;
  color: #b8a990;
  font-size: 14px;
  line-height: 1.95;
}

.name-field {
  display: block;
  margin: 26px 0 12px;
}

.name-field span {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.18em;
}

.name-field input {
  width: 100%;
  padding: 10px 12px;
  color: var(--paper);
  background: #0c1214;
  border: 1px solid var(--line-strong);
  border-radius: 0;
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: 0.08em;
  outline: none;
}

.name-field input:focus {
  border-color: var(--red-bright);
}

.name-field input::placeholder {
  color: rgba(242, 232, 213, 0.25);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  min-width: 220px;
  margin-top: 22px;
  padding: 15px 20px;
  color: #fff5e2;
  background: var(--red);
  border: 1px solid rgba(255, 255, 255, 0.08);
  cursor: pointer;
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: 0.2em;
  transition: background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
}

.btn-primary:hover {
  background: #a83a32;
  transform: translateY(-1px);
  box-shadow: 0 12px 30px rgba(142, 47, 42, 0.3);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-primary .arrow {
  font-family: var(--serif);
  font-size: 18px;
  opacity: 0.8;
}

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  padding: 10px 0;
  color: var(--gold-soft);
  background: transparent;
  border: 0;
  border-bottom: 1px solid transparent;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  transition: color 160ms ease, border-color 160ms ease;
}

.btn-ghost:hover {
  color: var(--paper);
  border-bottom-color: var(--line-strong);
}

.start-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  margin-top: 34px;
  padding-top: 18px;
  border-top: 1px solid rgba(183, 138, 75, 0.18);
  color: var(--muted);
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.1em;
}

.start-meta button {
  padding: 0;
  color: inherit;
  background: none;
  border: 0;
  border-bottom: 1px dotted rgba(183, 138, 75, 0.4);
  cursor: pointer;
}

.start-meta button:hover {
  color: var(--gold);
}

/* ---------- 游戏框架 ---------- */

body:has(.game-shell) {
  background:
    linear-gradient(180deg, rgba(12, 19, 21, 0.64), #101719 340px),
    var(--archive-scene) center top / 100% auto no-repeat,
    var(--ink);
}

.game-shell {
  position: relative;
  z-index: 1;
  max-width: 1240px;
  margin: 0 auto;
  padding: 22px 24px 80px;
}

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 14px;
}

.brand h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 0.22em;
}

.brand span {
  color: var(--muted);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.18em;
}

.topmeta {
  display: flex;
  align-items: center;
  gap: 18px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.topmeta b {
  color: var(--gold-soft);
  font-weight: 500;
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  min-height: 36px;
  padding: 0 12px;
  color: var(--muted);
  background: transparent;
  border: 1px solid rgba(183, 138, 75, 0.25);
  cursor: pointer;
  transition: color 160ms ease, border-color 160ms ease;
}

.icon-btn:hover {
  color: var(--paper);
  border-color: var(--gold);
}

.case-summary {
  display: grid;
  grid-template-columns: minmax(0, 1.75fr) repeat(3, minmax(0, 1fr));
  margin: 18px 0;
  border: 1px solid var(--line);
  background: #141e20;
}

.deadline,
.case-metric {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 9px;
  padding: 12px 16px;
  font-size: 13px;
  color: var(--muted);
}

.case-metric { border-left: 1px solid var(--line); }

.deadline b,
.case-metric b {
  color: var(--paper);
  font-size: 22px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.deadline b,
.case-metric .danger { color: var(--red-bright); }
.case-metric small { font-size: 12px; color: var(--muted); }

.deadline-line {
  align-self: center;
  flex: 1 1 32px;
  height: 4px;
  background: #3e3d34;
}

.deadline-line i {
  display: block;
  height: 100%;
  background: var(--red-bright);
}

.game-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 344px;
  gap: 22px;
  align-items: start;
}

/* ---------- 叙事面板 ---------- */

.story-panel {
  padding: 28px 30px 24px;
  min-height: 250px;
}

.story-panel .panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 13px;
  border-bottom: 1px solid rgba(112, 82, 43, 0.22);
}

.story-panel h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.24em;
  color: var(--red);
}

.story-panel .date {
  color: var(--muted-dark);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.1em;
}

.day-flavor {
  margin: 20px 0 4px;
  color: #57452f;
  font-size: 16px;
  line-height: 2;
  letter-spacing: 0.03em;
}

.day-flavor::first-letter {
  font-size: 1.35em;
}

.log-scroll {
  max-height: clamp(132px, 24vh, 224px);
  overflow-y: auto;
  padding-right: 8px;
  margin-top: 14px;
  scrollbar-width: thin;
  scrollbar-color: rgba(112, 82, 43, 0.3) transparent;
}

.log-scroll::-webkit-scrollbar {
  width: 5px;
}

.log-scroll::-webkit-scrollbar-thumb {
  background: rgba(112, 82, 43, 0.3);
}

.log-entry {
  padding: 12px 0 12px 16px;
  border-top: 1px dashed rgba(112, 82, 43, 0.2);
  border-left: 2px solid transparent;
  color: #463725;
  font-size: 14px;
  line-height: 1.9;
}

.log-entry:first-child {
  border-top: 0;
}

.log-entry .log-day {
  display: block;
  margin-bottom: 4px;
  color: var(--muted-dark);
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.14em;
}

.log-entry.clue {
  border-left-color: var(--gold);
  background: rgba(183, 138, 75, 0.1);
  color: #322619;
}

.log-entry.danger {
  border-left-color: var(--red);
  background: rgba(142, 47, 42, 0.07);
  color: #5a2c26;
}

.log-entry.rank {
  border-left-color: var(--jade);
  background: rgba(111, 129, 114, 0.1);
}

.log-entry em {
  color: var(--red);
  font-style: normal;
  font-weight: 600;
}

.log-entry strong {
  color: var(--text);
  font-weight: 600;
}

/* ---------- 行动区 ---------- */

.actions-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 24px 0 10px;
}

.actions-head h2 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 0.14em;
}

.actions-head span { color: var(--muted); font-size: 12px; }

.actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.action-card {
  position: relative;
  overflow: hidden;
  min-height: 112px;
  padding: 15px 15px 13px;
  text-align: left;
  color: var(--paper);
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.035), transparent 45%),
    #172123;
  border: 1px solid rgba(183, 138, 75, 0.25);
  cursor: pointer;
  transition: border-color 180ms ease, transform 180ms ease, background 180ms ease;
}

.action-card:hover:not(:disabled) {
  border-color: rgba(183, 138, 75, 0.7);
  transform: translateY(-2px);
  background: #253233;
}

.action-card:active:not(:disabled) {
  transform: translateY(0);
}

.action-card:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}

.action-card strong {
  display: block;
  margin-bottom: 6px;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: #f0e2c9;
}

.action-card small {
  display: block;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 12px;
  line-height: 1.55;
}

.action-card em {
  display: grid;
  gap: 3px;
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid var(--line);
  color: #b9cbbc;
  font-family: var(--sans);
  font-size: 12px;
  font-style: normal;
  line-height: 1.45;
}

.action-card .cost { color: #e3b199; }
.action-card.locked strong { color: var(--muted); }

/* ---------- 侧栏 ---------- */

.side-panel {
  padding: 18px 20px;
  margin-bottom: 14px;
  --red: #df8c77;
  --muted-dark: #beb8aa;
  color: var(--paper);
  border-color: var(--line);
  background: linear-gradient(145deg, #1b2628, #131d1f);
}

.side-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(112, 82, 43, 0.2);
}

.side-head h3 {
  margin: 0;
  color: var(--red);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.22em;
}

.side-head span {
  color: var(--muted-dark);
  font-family: var(--sans);
  font-size: 9px;
  letter-spacing: 0.08em;
}

.rank-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 15px 0 12px;
}

.rank-line strong {
  font-size: 23px;
  font-weight: 500;
  letter-spacing: 0.12em;
}

.rank-line .silver {
  color: var(--muted-dark);
  font-family: var(--sans);
  font-size: 11px;
}

.rank-line .silver b {
  color: var(--red);
  font-weight: 600;
}

.rank-track {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
}

.rank-track span {
  flex: 1;
  height: 3px;
  background: rgba(112, 82, 43, 0.18);
}

.rank-track span.on {
  background: var(--gold);
}

.rank-caption {
  color: var(--muted-dark);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.06em;
}

.rank-req {
  margin-top: 5px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: 0.02em;
  line-height: 1.6;
  opacity: 0.95;
}

.stats-list {
  margin-top: 14px;
}

.stat-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 4px 12px;
  margin: 9px 0;
}

.stat-row .label {
  color: #d8cdb8;
  font-size: 12px;
  letter-spacing: 0.08em;
}

.stat-row .value {
  color: var(--paper);
  font: 600 14px/1.2 var(--sans);
  font-variant-numeric: tabular-nums;
}

.stat-row small {
  margin-left: 5px;
  color: var(--muted);
  font: 10px var(--sans);
}

.stat-row.warn .label small { color: var(--red); }

.bar {
  position: relative;
  grid-column: 1 / -1;
  height: 5px;
  background: #3a4545;
}

.bar-threshold {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 1px;
  background: #e8d8b9;
}

.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #8e6a39, var(--gold));
  transition: width 320ms ease;
}

.bar.blue i {
  background: linear-gradient(90deg, #4f6d75, #7d9aa0);
}

.bar.red i {
  background: linear-gradient(90deg, #7e2a24, var(--red-bright));
}

.bar.green i {
  background: linear-gradient(90deg, #506b56, #86a08a);
}

.stat-row.warn .value {
  color: var(--red);
}

/* 卷宗 */

.dossier-count {
  color: var(--red);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.1em;
}

.clue-list {
  margin-top: 10px;
}

.clue-item {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: 8px;
  padding: 9px 0;
  border-top: 1px solid var(--line);
}

.clue-item:first-child {
  border-top: 0;
}

.clue-item .mark {
  color: #a9977b;
  font-family: var(--sans);
  font-size: 10px;
  line-height: 1.6;
}

.clue-item.known .mark {
  color: var(--red);
}

.clue-item .clue-title {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.clue-item.known .clue-title {
  color: var(--paper);
  font-weight: 600;
}

.clue-item .clue-sub {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 9px;
  line-height: 1.5;
}

.clue-item.known {
  width: 100%;
  border: 0;
  border-top: 1px solid var(--line);
  color: inherit;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.clue-item.known:hover { background: rgba(183, 138, 75, 0.1); }

.evidence-track {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  margin-top: 13px;
}

.evidence-track i { height: 5px; background: #3a4545; }
.evidence-track .on { background: var(--gold-soft); }
.evidence-track i:nth-child(5) { outline: 1px solid var(--gold); }
.evidence-goal { margin-top: 8px; color: var(--muted); font: 11px var(--sans); }

.clue-item.known:hover .clue-title {
  color: var(--red);
}

/* 关系 */

.relation-row {
  display: grid;
  grid-template-columns: minmax(80px, 1fr) auto 34px;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-top: 1px dashed rgba(112, 82, 43, 0.16);
}

.relation-row:first-child {
  border-top: 0;
}

.relation-row .name {
  color: var(--paper);
  font-size: 12px;
}

.relation-row .role {
  color: var(--muted);
  font-family: var(--sans);
  font-size: 8px;
}

.relation-row .level {
  color: var(--muted-dark);
  font-family: var(--sans);
  font-size: 9px;
  text-align: right;
}

.relation-pips {
  display: flex;
  gap: 3px;
}

.relation-pips i {
  width: 9px;
  height: 9px;
  border: 1px solid rgba(112, 82, 43, 0.3);
  transform: rotate(45deg);
}

.relation-pips i.on {
  background: var(--red);
  border-color: var(--red);
}

.tip-box {
  margin-top: 10px;
  padding: 10px 12px;
  color: #e1ceb0;
  background: rgba(183, 138, 75, 0.1);
  border-left: 2px solid var(--gold);
  font-family: var(--sans);
  font-size: 10px;
  line-height: 1.7;
}

/* ---------- 弹窗 ---------- */

.modal-root {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  place-items: center;
  padding: 22px;
  background: rgba(8, 13, 15, 0.8);
  backdrop-filter: blur(5px);
}

.modal-root.open {
  display: grid;
  animation: fadeIn 180ms ease both;
}

.modal-card {
  position: relative;
  width: min(640px, 100%);
  max-height: 88dvh;
  overflow-y: auto;
  padding: 34px 36px 30px;
  color: var(--text);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.45), transparent 34%),
    repeating-linear-gradient(0deg, rgba(92, 70, 40, 0.035) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, #eee4d1 0%, #ecdfc6 100%);
  border: 1px solid rgba(112, 82, 43, 0.5);
  box-shadow: 0 34px 100px rgba(0, 0, 0, 0.6);
  animation: riseIn 220ms ease both;
  scrollbar-width: thin;
}

.modal-card::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(112, 82, 43, 0.18);
  pointer-events: none;
}

.modal-card .modal-kicker {
  position: relative;
  z-index: 1;
  color: var(--red);
  font-family: var(--sans);
  font-size: 9px;
  letter-spacing: 0.24em;
}

.modal-card h2 {
  position: relative;
  z-index: 1;
  margin: 12px 0 18px;
  color: #241a11;
  font-size: clamp(24px, 3.6vw, 34px);
  font-weight: 500;
  letter-spacing: 0.1em;
  line-height: 1.35;
}

.modal-card p {
  position: relative;
  z-index: 1;
  margin: 0 0 12px;
  color: #4d3b27;
  font-size: 14px;
  line-height: 1.95;
  letter-spacing: 0.02em;
}

.modal-card p.quote {
  padding-left: 14px;
  border-left: 2px solid var(--red);
  color: #6a3a31;
  font-style: italic;
}

.modal-choices {
  position: relative;
  z-index: 1;
  display: grid;
  gap: 8px;
  margin-top: 24px;
}

.choice-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  width: 100%;
  padding: 13px 15px;
  color: #3b2b1b;
  text-align: left;
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(112, 82, 43, 0.28);
  cursor: pointer;
  font-size: 13px;
  line-height: 1.5;
  transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
}

.choice-btn:hover {
  background: rgba(183, 138, 75, 0.16);
  border-color: var(--red);
  transform: translateX(3px);
}

.choice-btn .choice-arrow {
  color: var(--red);
  font-family: var(--serif);
  font-size: 16px;
  opacity: 0.7;
}

.choice-btn small {
  display: block;
  margin-top: 3px;
  color: #69543b;
  font-family: var(--sans);
  font-size: 12px;
  line-height: 1.5;
}

.choice-btn.disabled,
.choice-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

.modal-note {
  position: relative;
  z-index: 1;
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid rgba(112, 82, 43, 0.2);
  color: #69543b;
  font-family: var(--sans);
  font-size: 12px;
  line-height: 1.7;
}

/* ---------- 结局 ---------- */

.ending-screen {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 54px 22px;
  background:
    linear-gradient(180deg, rgba(8, 14, 16, 0.67), rgba(8, 14, 16, 0.48) 45%, #101719),
    var(--archive-scene) center top / cover no-repeat;
}

.ending-wrap {
  width: min(780px, 100%);
  text-align: center;
}

.ending-kicker {
  color: var(--gold);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.36em;
}

.ending-title {
  margin: 16px 0 6px;
  color: #f2e5ce;
  font-size: clamp(46px, 8vw, 86px);
  font-weight: 400;
  letter-spacing: 0.14em;
  line-height: 1.2;
}

.ending-sub {
  color: var(--red-bright);
  font-size: 15px;
  letter-spacing: 0.18em;
}

.ending-rule {
  width: 1px;
  height: 22px;
  margin: 18px auto;
  background: linear-gradient(180deg, transparent, var(--gold), transparent);
}

.ending-body {
  max-width: 640px;
  margin: 0 auto;
  padding: 28px 32px;
  text-align: left;
}

.ending-body p {
  margin: 0 0 14px;
  color: #4a3926;
  font-size: 14px;
  line-height: 2.1;
}

.ending-body p:last-child {
  margin-bottom: 0;
}

.ending-body .last-line {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px dashed rgba(112, 82, 43, 0.28);
  color: var(--red);
  font-style: italic;
}

.ending-stats {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px 22px;
  margin: 24px 0 4px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.08em;
}

.ending-stats b {
  color: var(--gold-soft);
  font-weight: 500;
}

.ending-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 28px;
}

.ending-actions .btn-primary {
  margin-top: 0;
}

.ending-actions .btn-ghost {
  margin-top: 0;
  padding: 12px 18px;
  border: 1px solid rgba(183, 138, 75, 0.28);
}

.ending-collection {
  margin-top: 18px;
  color: var(--muted-dark);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.08em;
}

/* ---------- 图鉴 ---------- */

.gallery-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 16px;
}

.gallery-item {
  padding: 10px 12px;
  border: 1px solid rgba(112, 82, 43, 0.24);
  background: rgba(255, 255, 255, 0.12);
}

.gallery-item .g-title {
  color: #3e2e1d;
  font-size: 13px;
  letter-spacing: 0.06em;
}

.gallery-item .g-sub {
  margin-top: 3px;
  color: #927d61;
  font-family: var(--sans);
  font-size: 8px;
  line-height: 1.5;
}

.gallery-item.locked {
  opacity: 0.42;
}

.gallery-item.locked .g-title {
  color: #6e5b46;
}

/* ---------- 提示 ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  z-index: 200;
  max-width: min(90vw, 460px);
  padding: 10px 16px;
  color: #f5e8d1;
  background: rgba(30, 23, 17, 0.96);
  border: 1px solid rgba(183, 138, 75, 0.4);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  font-family: var(--sans);
  font-size: 11px;
  line-height: 1.6;
  letter-spacing: 0.04em;
  opacity: 0;
  transform: translate(-50%, 10px);
  pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------- 动画 ---------- */

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes riseIn {
  from { opacity: 0; transform: translateY(14px) scale(0.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes softPulse {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}

/* ---------- 响应式 ---------- */

button:focus-visible,
.log-scroll:focus-visible {
  outline: 2px solid #b17a47;
  outline-offset: 3px;
}

@media (max-width: 980px) {
  .start {
    gap: 26px;
    padding-inline: 24px;
  }

  .game-grid { grid-template-columns: 1fr; }
  .side-panel { margin-bottom: 0; }

  .game-grid .side-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-items: start;
  }
}

@media (max-width: 680px) {
  .case-summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .deadline { grid-column: 1 / -1; border-bottom: 1px solid var(--line); }
  .case-metric:nth-child(2) { border-left: 0; }
  .deadline, .case-metric { padding: 8px 10px; }
  .case-metric b { font-size: 19px; }

  .game-shell {
    padding: 16px 14px 64px;
  }

  .topbar {
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .brand h1 { font-size: 19px; letter-spacing: 0.1em; }
  .brand span { display: none; }

  .topmeta {
    flex-wrap: wrap;
    gap: 10px 14px;
  }

  .story-panel {
    min-height: 0;
    padding: 18px 16px;
  }

  .log-scroll { max-height: 126px; }

  .actions {
    grid-template-columns: 1fr 1fr;
  }

  .action-card {
    min-height: 104px;
    padding: 13px;
  }

  .action-card strong {
    font-size: 15px;
  }

  .game-grid .side-col {
    grid-template-columns: 1fr;
  }

  .modal-card {
    padding: 26px 20px 22px;
  }

  .modal-card h2 {
    font-size: 23px;
  }

  .ending-body {
    padding: 22px 20px;
  }

  .gallery-grid {
    grid-template-columns: 1fr;
  }

}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

  let state = null;
  let gameScreen = 'start';
  let modalQueue = [];
  let modalBusy = false;
  let modalClosing = false;
  let toastTimer = null;

  const $app = () => document.getElementById('app');
  const $modal = () => document.getElementById('modal-root');
  const $toast = () => document.getElementById('toast');

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const chance = (p) => Math.random() < p;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function newGame(name) {
    return {
      version: 1,
      name: name || '沈青梧',
      day: 1,
      rank: 0,
      silver: 20,
      stats: {
        talent: 22,
        popularity: 12,
        trust: 18,
        reputation: 50,
        scheme: 8,
        fatigue: 8,
        mood: 48,
        risk: 0
      },
      clues: {
        script: false,
        time: false,
        ledger: false,
        silver: false,
        letter: false,
        witness: false
      },
      relations: { gu: 1, pei: 0, lu: 0, zhou: 0 },
      flags: {
        introSeen: false,
        forged: false,
        warned: false,
        metZheng: false,
        finalChoice: ''
      },
      seenEvents: [],
      log: [],
      ended: false,
      ending: null
    };
  }

  function applyMods(mods) {
    if (!state || !mods) return;
    const keys = ['talent', 'popularity', 'trust', 'reputation', 'scheme', 'fatigue', 'mood', 'risk'];
    keys.forEach((key) => {
      if (typeof mods[key] === 'number') {
        state.stats[key] = clamp(state.stats[key] + mods[key], 0, 100);
      }
    });
    if (typeof mods.silver === 'number') {
      state.silver = Math.max(0, state.silver + mods.silver);
    }
    if (mods.rel) {
      Object.keys(mods.rel).forEach((key) => {
        if (state.relations[key] === undefined) state.relations[key] = 0;
        state.relations[key] = clamp(state.relations[key] + mods.rel[key], 0, 5);
      });
    }
  }

  function addLog(text, type) {
    if (!state) return;
    state.log.push({ day: state.day, text, type: type || '' });
    if (state.log.length > 90) state.log.shift();
  }

  function clueCount() {
    if (!state) return 0;
    return CLUE_IDS.filter((id) => state.clues[id]).length;
  }

  function addClue(id) {
    if (!state || state.clues[id]) return false;
    state.clues[id] = true;
    addLog(CLUES[id].text, 'clue');
    showToast('查得线索：' + CLUES[id].title);
    return true;
  }

  function efficiency() {
    if (!state) return 1;
    let e = 1;
    if (state.stats.fatigue >= 75) e *= 0.5;
    if (state.stats.mood < 30) e *= 0.8;
    return e;
  }

  function workTrustGain(bonus) {
    return Math.max(2, Math.round((4 + state.rank + bonus) * efficiency()));
  }

  function studyTalentGain() {
    return Math.max(2, Math.round((5 + (state.stats.mood >= 60 ? 1 : 0)) * efficiency()));
  }

  /* ---------------- 存档 ---------------- */

  function save() {
    if (!state) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        version: 1,
        savedAt: Date.now(),
        state
      }));
    } catch (e) {
      /* 隐私模式下忽略 */
    }
  }

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const payload = JSON.parse(raw);
      const data = payload && payload.state ? payload.state : payload;
      if (!data || !data.stats) return null;
      const base = newGame(data.name);
      const merged = Object.assign({}, base, data, {
        stats: Object.assign({}, base.stats, data.stats || {}),
        clues: Object.assign({}, base.clues, data.clues || {}),
        relations: Object.assign({}, base.relations, data.relations || {}),
        flags: Object.assign({}, base.flags, data.flags || {}),
        seenEvents: Array.isArray(data.seenEvents) ? data.seenEvents : [],
        log: Array.isArray(data.log) ? data.log : []
      });
      merged.day = clamp(Number(merged.day) || 1, 1, MAX_DAY);
      merged.rank = clamp(Number(merged.rank) || 0, 0, RANKS.length - 1);
      merged.silver = Math.max(0, Number(merged.silver) || 0);
      return merged;
    } catch (e) {
      return null;
    }
  }

  function clearSave() {
    try {
      localStorage.removeItem(SAVE_KEY);
    } catch (e) {
      /* ignore */
    }
  }

  function getGallery() {
    try {
      const raw = localStorage.getItem(GALLERY_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter((id) => ENDINGS[id]) : [];
    } catch (e) {
      return [];
    }
  }

  function addGallery(id) {
    try {
      const arr = getGallery();
      if (!arr.includes(id)) {
        arr.push(id);
        localStorage.setItem(GALLERY_KEY, JSON.stringify(arr));
      }
    } catch (e) {
      /* ignore */
    }
  }

  /* ---------------- 提示 ---------------- */

  function showToast(text) {
    const el = $toast();
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ---------------- 弹窗 ---------------- */

  function queueModal(modal) {
    modalQueue.push(modal);
    if (!modalBusy && !modalClosing) showNextModal();
  }

  function pumpModals() {
    if (!modalBusy && !modalClosing && modalQueue.length) showNextModal();
  }

  function showNextModal() {
    if (modalBusy || modalClosing) return;
    const modal = modalQueue.shift();
    if (!modal) return;
    modalBusy = true;
    const root = $modal();
    const bodyHtml = modal.html || (Array.isArray(modal.body) ? modal.body : String(modal.body || '').split(/\n\n+/))
      .filter(Boolean)
      .map((p) => '<p>' + p + '</p>')
      .join('');
    const choices = modal.choices && modal.choices.length ? modal.choices : [{ label: '合上' }];
    root.innerHTML = `
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="${escapeHtml(modal.title || '')}">
        <div class="modal-kicker">${escapeHtml(modal.kicker || '值房夜话')}</div>
        <h2>${escapeHtml(modal.title || '')}</h2>
        ${bodyHtml}
        ${modal.note ? `<div class="modal-note">${modal.note}</div>` : ''}
        <div class="modal-choices"></div>
      </div>
    `;
    const box = root.querySelector('.modal-choices');
    choices.forEach((choice) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn' + (choice.disabled ? ' disabled' : '');
      btn.disabled = !!choice.disabled;
      btn.innerHTML = `
        <span>${escapeHtml(choice.label)}
          ${choice.sub ? `<small>${escapeHtml(choice.sub)}</small>` : ''}
        </span>
        <span class="choice-arrow">→</span>
      `;
      btn.addEventListener('click', () => {
        if (choice.disabled) return;
        const action = choice.action;
        closeModal(action);
      });
      box.appendChild(btn);
    });
    root.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(callback) {
    if (!modalBusy) {
      if (callback) callback();
      pumpModals();
      return;
    }
    modalBusy = false;
    modalClosing = true;
    const root = $modal();
    root.classList.remove('open');
    root.innerHTML = '';
    document.body.style.overflow = '';
    setTimeout(() => {
      modalClosing = false;
      if (callback) callback();
      pumpModals();
    }, 110);
  }

  function clearModal() {
    modalQueue = [];
    modalBusy = false;
    modalClosing = false;
    const root = $modal();
    if (root) {
      root.classList.remove('open');
      root.innerHTML = '';
    }
    document.body.style.overflow = '';
  }

  /* ---------------- 渲染入口 ---------------- */

  function statRow(label, key, cls, threshold, warning) {
    const value = state.stats[key];
    const warn = warning && (key === 'mood' ? value < threshold : value >= threshold);
    return `
      <div class="stat-row ${warn ? 'warn' : ''}">
        <span class="label">${label}${warn ? `<small>${warning}</small>` : ''}</span>
        <span class="value">${value}<small>/100</small></span>
        <span class="bar ${cls}" aria-hidden="true"><i style="width:${value}%"></i>
          ${threshold === undefined ? '' : `<b class="bar-threshold" style="left:${threshold}%"></b>`}
        </span>
      </div>
    `;
  }

  function relationPips(level) {
    let html = '';
    for (let i = 0; i < 5; i += 1) {
      html += `<i class="${i < level ? 'on' : ''}"></i>`;
    }
    return html;
  }

      gameScreen = 'start';
      renderStart();
      return;

    const maxTrust = workTrustGain(2);

    const flavor = DAY_FLAVOR[Math.min(DAY_FLAVOR.length - 1, state.day - 1)];

                  ${statRow('心情', 'mood', 'green', 30, '效率下降')}
                  ${statRow('疲劳', 'fatigue', 'red', 75, '效率减半')}
                  ${statRow('危机', 'risk', 'red', 60, '警戒')}
                </div>
                <div class="tip-box">${tip}</div>
              </div>
            </section>

            <section class="paper side-panel">
              <div class="paper-inner">
                <div class="side-head"><h3>姐姐的案子</h3><span class="dossier-count">${c} / 6</span></div>
                <div class="evidence-track" aria-hidden="true">
                  ${CLUE_IDS.map((_, i) => `<i class="${i < c ? 'on' : ''}"></i>`).join('')}
                </div>
                <div class="evidence-goal">当堂翻案至少需要 5 份线索</div>
                <div class="clue-list">${clueHtml}</div>
              </div>
            </section>

            <section class="paper side-panel">
              <div class="paper-inner">
                <div class="side-head"><h3>人情</h3><span>走动可增长</span></div>
                <div class="relation-list">${relHtml}</div>
              </div>
            </section>
          </aside>
        </div>
      </div>
    `;
  }

  function renderEnding() {
    const ending = ENDINGS[state.ending] || ENDINGS.executed;
    const gallery = getGallery();
    const body = ending.body.map((p) => `<p>${p}</p>`).join('') + `<p class="last-line">${ending.last}</p>`;
    $app().innerHTML = `
      <main class="ending-screen">
        <div class="ending-wrap">
          <div class="ending-kicker">${ending.kicker} · 第 ${state.day} 日 · 终局</div>
          <h1 class="ending-title">${ending.title}</h1>
          <div class="ending-sub">${ending.sub}</div>
          <div class="ending-rule"></div>
          <div class="paper ending-body"><div class="paper-inner">${body}</div></div>
          <div class="ending-stats">
            <span>最终位分 <b>${RANKS[state.rank].name}</b></span>
            <span>查得线索 <b>${clueCount()} / 6</b></span>
            <span>上官信任 <b>${state.stats.trust}</b></span>
            <span>清誉 <b>${state.stats.reputation}</b></span>
          </div>
          <div class="ending-actions">
            <button class="btn-primary" data-action="restart">再来一世 <span class="arrow">→</span></button>
            <button class="btn-ghost" data-action="gallery">结局图鉴</button>
          </div>
          <div class="ending-collection">已收集 ${gallery.length} / ${Object.keys(ENDINGS).length} 个结局</div>
        </div>
      </main>
    `;
  }

  /* ---------------- 开始 / 继续 ---------------- */

  function startNewGame(name) {
    state = newGame((name || '').trim() || '沈青梧');
    gameScreen = 'game';
    addLog('你走进御前典簿司。值房里只有一张空案，案上放着一支旧笔。', '');
    addLog('距秋决还有三十日。', 'danger');
    save();
    render();
    queueModal({
      kicker: '承平二十七年 · 十月初七',
      title: '你只有三十天',
      body: [
        '三日前，御前典簿司掌籍女史沈兰因以“私改军粮账册、盗卖官粮”下狱。案卷齐备，画押俱全。',
        '她是你的姐姐。昨夜，狱卒老周递进来一句话。姐姐说：我没有上堂，也没有画押。',
        '典簿司掌司顾清和把一支笔放在你面前。“你姐姐的位置空着。你替她抄完这个月，也替她查清楚。”',
        '“三十日。要么你姐姐的案子翻过来，要么你替她死。”'
      ],
      choices: [{
        label: '接过那支笔',
        sub: '笔杆上还留着姐姐的体温。',
        action: () => {
          state.flags.introSeen = true;
          addLog('你接过笔。顾清和看了你很久，转身走了。', 'rank');
          save();
          render();
        }
      }]
    });
  }

  function continueGame() {
    const saved = loadSave();
    if (!saved) {
      showToast('没有找到存档。');
      return;
    }
    state = saved;
    gameScreen = state.ended ? 'ending' : 'game';
    render();
    if (!state.ended && !state.flags.introSeen) {
      queueModal({
        kicker: '承平二十七年 · 十月初七',
        title: '你只有三十天',
        body: ['案卷还在，姐姐还在狱里。你还有三十天。'],
        choices: [{
          label: '继续',
          action: () => {
            state.flags.introSeen = true;
            save();
            render();
          }
        }]
      });
    }
  }

  function restart() {
    clearSave();
    state = null;
    gameScreen = 'start';
    clearModal();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------------- 行动 ---------------- */

  function guard() {
    if (!state || state.ended) return false;
    return true;
  }

  function actionWork() {
    if (!guard()) return;
    const gain = workTrustGain(rand(0, 2));
    applyMods({ trust: gain, talent: 1, fatigue: 12, reputation: 1, mood: -1 });
    addLog(pick(WORK_LINES[Math.min(state.rank, WORK_LINES.length - 1)]), '');
    if (state.stats.fatigue >= 85) {
      addLog('你熬到散值，眼前发花。再这样下去，身子要垮。', 'danger');
    }
    advance();
  }

  function actionStudy() {
    if (!guard()) return;
    const gain = studyTalentGain();
    applyMods({ talent: gain, fatigue: 10, mood: -2, reputation: 1 });
    addLog(pick(STUDY_LINES), '');
    advance();
  }

  function actionRest() {
    if (!guard()) return;
    applyMods({ fatigue: -32, mood: 8, reputation: 1 });
    addLog(pick(REST_LINES), '');
    advance();
  }

  function actionSocial() {
    if (!guard()) return;
    const choices = Object.keys(SOCIALS).map((key) => {
      const p = SOCIALS[key];
      const level = state.relations[key] || 0;
      return {
        label: p.name + ' · ' + p.role,
        sub: p.effect + ' · 当前关系 ' + level + '/5 · 银 −2 · 疲劳 +8',
        disabled: state.silver < 2,
        action: () => resolveSocial(key)
      };
    });
    choices.push({
      label: '改日再说',
      sub: '不消耗今日。',
      action: () => {}
    });
    queueModal({
      kicker: '人情往来',
      title: '今日去见谁？',
      body: [
        '宫里的人情，是一张一张纸叠起来的。你只有一次机会，把纸递到对的人手里。',
        state.silver < 2 ? '你摸了摸袖袋，连一包点心的钱都不够。' : '袖袋里还有 ' + state.silver + ' 两银子。'
      ],
      choices
    });
  }

  function resolveSocial(key) {
    if (!guard()) return;
    if (state.silver < 2) {
      showToast('你连一包点心的钱都没有。');
      return;
    }
    const p = SOCIALS[key];
    const rel = {};
    rel[key] = 1;
    applyMods({ silver: -2, fatigue: 8, rel });
    if (key === 'gu') applyMods({ trust: 4, popularity: 1 });
    if (key === 'pei') applyMods({ popularity: 5, mood: 2 });
    if (key === 'lu') applyMods({ scheme: 4, talent: 1 });
    if (key === 'zhou') applyMods({ popularity: 2, mood: 1 });
    addLog(pick(p.lines), '');
    checkSocialClue(key);
    advance();
  }

  function checkSocialClue(key) {
    const rel = state.relations[key];
    if (key === 'zhou' && rel >= 3 && !state.clues.witness) {
      addClue('witness');
    }
    if (key === 'pei' && rel >= 3 && !state.clues.time) {
      addClue('time');
    }
    if (key === 'lu' && rel >= 3 && !state.clues.silver) {
      addClue('silver');
    }
    if (key === 'gu' && rel >= 4 && state.stats.trust >= 55 && !state.clues.letter) {
      addClue('letter');
    }
  }

  function actionInvestigate() {
    if (!guard()) return;
    if (clueCount() >= CLUE_IDS.length) {
      showToast('六份卷宗都已查过。剩下的，是怎么用它们。');
      return;
    }
    const choices = ARCHIVES.map((a) => {
      const known = state.clues[a.id];
      const can = a.req(state);
      return {
        label: a.name + (known ? ' · 已查得' : ''),
        sub: known ? CLUES[a.id].title : (can ? `${a.desc} 疲劳 +${a.fatigue} · 危机 +${a.risk}` : '需要：' + a.reqText),
        disabled: known || !can,
        action: () => resolveArchive(a)
      };
    });
    choices.push({
      label: '先回去',
      sub: '不消耗今日。',
      action: () => {}
    });
    queueModal({
      kicker: '档案库',
      title: '调哪一份卷宗？',
      body: [
        '档案库的钥匙在掌籍女史手里。你只有一次调阅的机会，不能留下太多痕迹。',
        '查档会消耗精力，也会让你离某些人更近。'
      ],
      note: '未满足条件的卷宗暂时调不出来。先当值、学艺或走动。',
      choices
    });
  }

  function resolveArchive(a) {
    if (!guard()) return;
    if (state.clues[a.id]) return;
    if (!a.req(state)) {
      showToast('你还没有调阅这份卷宗的资格。');
      return;
    }
    applyMods({ fatigue: a.fatigue, risk: a.risk, talent: 1 });
    addClue(a.id);
    addLog('你调出了' + a.name + '。灯下看了很久，终于在一处不起眼的地方停住。', 'clue');
    advance();
  }

  function actionScheme() {
    if (!guard()) return;
    if (state.stats.scheme < 25) {
      showToast('你的手段还不足以布局。多和陆知微走动，或先查几份卷宗。');
      return;
    }
    queueModal({
      kicker: '暗处',
      title: '要不要走这一步？',
      body: [
        '有些路，走一次就回不了头。可你也没有太多时间了。',
        '你现在的危机是 ' + state.stats.risk + ' / 100。越高，越容易被人先下手。'
      ],
      note: '布局会消耗一日。风险由你承担。',
      choices: [
        {
          label: '打点狱卒，再见姐姐一面',
          sub: '花费 8 两 · 老周关系 +1 · 危机 +5 · 疲劳 +8',
          disabled: state.silver < 8,
          action: () => {
            applyMods({ silver: -8, fatigue: 8, risk: 5, rel: { zhou: 1 } });
            addLog('你把银子塞进老周手里。他没数，只叹了口气：“别待太久。”', 'danger');
            if (state.relations.zhou >= 3 && !state.clues.witness) addClue('witness');
            advance();
          }
        },
        {
          label: '把消息散出去，逼他们动',
          sub: '人望 +6 · 清誉 −4 · 危机 +3 · 疲劳 +8',
          action: () => {
            applyMods({ popularity: 6, reputation: -4, risk: 3, fatigue: 8 });
            addLog('你托裴小满把话递到几个值房。第二日，宫里都在传：军粮案要重审。', 'danger');
            advance();
          }
        },
        {
          label: '仿一份提审手令',
          sub: '需手段 40 · 五成成功 · 失败即终局',
          disabled: state.stats.scheme < 40,
          action: () => {
            if (chance(0.5)) {
              state.flags.forged = true;
              applyMods({ scheme: 4, risk: 12, fatigue: 10, mood: -4 });
              addLog('你对着旧手令练了三夜。新纸做旧，印色也调得八九不离十。', 'danger');
              showToast('你得到一份伪造的提审手令。');
              advance();
            } else {
              ending('forgery');
            }
          }
        },
        {
          label: '什么都不做，先稳住',
          sub: '危机 −4 · 心情 +2 · 疲劳 +2',
          action: () => {
            applyMods({ risk: -4, mood: 2, fatigue: 2 });
            addLog('你把案卷收进柜子，吹了灯。今夜什么也不做。', '');
            advance();
          }
        }
      ]
    });
  }

  /* ---------------- 日推进 ---------------- */

  function advance() {
    if (!state || state.ended) return;
    state.day += 1;

    if (state.day === 11 || state.day === 21) {
      paySalary();
      checkPromotion();
    }

    if (state.day > MAX_DAY) {
      state.day = MAX_DAY;
      state.silver += RANKS[state.rank].salary;
      addLog('最后一旬的俸银发下来了：' + RANKS[state.rank].salary + ' 两。', '');
      save();
      render();
      setTimeout(showFinale, 260);
      return;
    }

    if (state.stats.fatigue >= 100) {
      save();
      render();
      setTimeout(() => ending('ill'), 260);
      return;
    }

    maybeEvent();
    save();
    render();
    pumpModals();
  }

  function paySalary() {
    const amount = RANKS[state.rank].salary;
    state.silver += amount;
    addLog('十日一结的俸银发下来了：' + amount + ' 两。', '');
  }

  function checkPromotion() {
    const c = clueCount();
    if (state.day === 11 && state.rank === 0) {
      if (state.stats.trust >= 25 && state.stats.talent >= 25 && c >= 1) {
        state.rank = 1;
        addLog('考功通过。顾清和把你的名字写进掌籍册：沈青梧，掌籍女史。', 'rank');
        queueModal({
          kicker: '考功 · 第一场',
          title: '掌籍女史',
          body: ['顾清和把一库钥匙推到你面前。“从明日起，你不再是抄录。”', '她没有笑。但也没有再看你案上的罪籍。'],
          choices: [{ label: '领命' }]
        });
      } else {
        addLog('考功未过。你的名字还停在抄录册上。', 'danger');
        queueModal({
          kicker: '考功 · 第一场',
          title: '留任',
          body: ['掌司在考功簿上批了“留任”二字。', '你没有说话。回去的路上，把袖里的卷宗攥得很紧。'],
          choices: [{ label: '继续' }]
        });
      }
    }
    if (state.day === 21 && state.rank === 1) {
      if (state.stats.trust >= 45 && state.stats.talent >= 45 && state.stats.popularity >= 25 && c >= 3) {
        state.rank = 2;
        addLog('考功通过。你成了典簿司掌事，掌司之下，文书都要过你的手。', 'rank');
        queueModal({
          kicker: '考功 · 第二场',
          title: '典簿司掌事',
          body: ['你搬进了靠里那间值房。窗外能看见档案库的檐角。', '顾清和把一串库房钥匙放在你案上，说：“现在，你能调所有旧档了。”'],
          choices: [{ label: '领命' }]
        });
      } else {
        addLog('第二场考功未过。你还坐在原来的位置上。', 'danger');
        queueModal({
          kicker: '考功 · 第二场',
          title: '留任',
          body: ['掌司没有见你，只让人送来一句话：再等等。', '可你没有多少时间可以等了。'],
          choices: [{ label: '继续' }]
        });
      }
    }
  }

  function maybeEvent() {
    if (state.day >= MAX_DAY) return;
    if (!chance(0.42)) return;
    const pool = EVENTS.filter((ev) => !state.seenEvents.includes(ev.id));
    if (!pool.length) return;
    const ev = pick(pool);
    state.seenEvents.push(ev.id);
    queueModal({
      kicker: ev.kicker || '值房夜话',
      title: ev.title,
      body: ev.text,
      note: ev.note,
      choices: ev.choices.map((choice) => ({
        label: choice.label,
        sub: choice.sub,
        disabled: choice.disabled ? choice.disabled() : false,
        action: () => {
          choice.effect();
          addLog(choice.log, choice.type || '');
          save();
          render();
        }
      }))
    });
  }

  /* ---------------- 终局 ---------------- */

  function showFinale() {
    if (!state || state.ended) return;
    const c = clueCount();
    if (state.stats.fatigue >= 100) {
      ending('ill');
      return;
    }
    if (state.stats.risk >= 95 && c < 6) {
      ending('silenced');
      return;
    }
    if (state.stats.reputation < 25 || state.stats.trust < 15) {
      queueModal({
        kicker: '十一月初六 · 秋决',
        title: '你被挡在门外',
        body: ['你赶到宫门时，腰牌已经被收走了。', '典簿司的考功簿上写着：清誉有亏，不堪任用。'],
        choices: [{ label: '离开', action: () => ending('dismissed') }]
      });
      return;
    }
    if (c < 3) {
      queueModal({
        kicker: '十一月初六 · 秋决',
        title: '证据不够',
        body: [
          '你手里只有零碎的疑点。它们拼不成一份能递上去的呈文。',
          '午时三刻，鼓响。你站在人群里，听见姐姐的名字被念出来。'
        ],
        choices: [{ label: '去刑场', action: () => ending('executed') }]
      });
      return;
    }

    const effective = c + (state.flags.forged ? 1 : 0);
    const canExpose = effective >= 5 && state.stats.reputation >= 50 && state.stats.risk < 85;
    const canGu = effective >= 5 && state.stats.trust >= 60;
    const choices = [];

    if (canExpose) {
      choices.push({
        label: '当堂呈上全部证据',
        sub: '把六份卷宗，一件一件摆到三司面前。',
        action: () => exposeChoice()
      });
    }
    if (canGu) {
      choices.push({
        label: '请顾清和代为上奏',
        sub: '她还有一份直达御前的奏本。',
        action: () => exposeChoice()
      });
    }
    choices.push({
      label: '与郑铨做一笔交易',
      sub: '用证据换姐姐一条命，也换自己的前程。',
      action: () => ending('deal')
    });
    choices.push({
      label: '烧掉证据，封存卷宗',
      sub: '保住自己，让姐姐的案子永远沉下去。',
      action: () => ending('seal')
    });
    choices.push({
      label: '什么都不做',
      sub: '你没有走进三司会审的大门。',
      action: () => ending('executed')
    });

    queueModal({
      kicker: '十一月初六 · 三司会审',
      title: '最后一日',
      body: [
        '三司会审设在刑部大堂。你站在门外，怀里抱着六份卷宗。',
        canExpose
          ? '证据够了。但你也知道，只要递上去，就没有回头路。'
          : '证据还差一点。你可以递，也可以拿它去换别的东西。',
        state.flags.forged ? '其中一份手令，是你自己仿的。没有人看出来。' : ''
      ].filter(Boolean),
      note: '这是最后的选择。',
      choices
    });
  }

  function exposeChoice() {
    queueModal({
      kicker: '三司会审 · 案已翻',
      title: '你要什么？',
      body: [
        '曹弼被当场拿下。郑铨坐在上首，脸色很白。堂上安静了很久，才有人敲下惊堂木。',
        '姐姐的案子翻了。她从狱里出来时，天已经黑了。',
        '顾清和把御前女官的印信推到你面前。姐姐站在门外，没有进来。'
      ],
      note: '你只能选一次。',
      choices: [
        {
          label: '留在宫里，接下御前女官之印',
          sub: '你赢了。但你也成了这套规矩的一部分。',
          action: () => {
            state.rank = 3;
            ending('clear_stay');
          }
        },
        {
          label: '辞官，带姐姐离开京城',
          sub: '你救了她，也放过了自己。',
          action: () => ending('clear_leave')
        }
      ]
    });
  }

  function ending(type) {
    if (!state) return;
    state.ended = true;
    state.ending = type;
    addGallery(type);
    save();
    clearModal();
    gameScreen = 'ending';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------------- 菜单 / 图鉴 ---------------- */

  function openMenu() {
    if (!state) return;
    queueModal({
      kicker: '暂歇',
      title: '要做什么？',
      body: ['宫门还没下钥。你可以再坐一会儿。'],
      choices: [
        {
          label: '回到封面',
          sub: '当前进度会自动保存。',
          action: () => {
            gameScreen = 'start';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        },
        {
          label: '结局图鉴',
          sub: '看看你已经走到过哪些地方。',
          action: () => showGallery()
        },
        {
          label: '重新开始',
          sub: '当前这一局会被清掉。',
          action: () => confirmRestart()
        }
      ]
    });
  }

  function confirmRestart() {
    queueModal({
      kicker: '重新开始',
      title: '确定要重来？',
      body: ['当前这一局的进度会被清除。已经收集的结局会保留。'],
      choices: [
        { label: '重来', action: () => restart() },
        { label: '再想想' }
      ]
    });
  }

  function showGallery() {
    const unlocked = getGallery();
    const ids = Object.keys(ENDINGS);
    const items = ids.map((id) => {
      const e = ENDINGS[id];
      const has = unlocked.includes(id);
      return `
        <div class="gallery-item ${has ? '' : 'locked'}">
          <div class="g-title">${has ? e.title : '？？？'}</div>
          <div class="g-sub">${has ? e.sub : '尚未抵达'}</div>
        </div>
      `;
    }).join('');
    queueModal({
      kicker: '结局图鉴',
      title: '已收集 ' + unlocked.length + ' / ' + ids.length,
      html: `<div class="gallery-grid">${items}</div>`,
      choices: [{ label: '合上' }]
    });
  }

  /* ---------------- 事件委托 ---------------- */

  document.addEventListener('click', (event) => {
    const trigger = event.target.closest('[data-action]');
    if (trigger) {
      const action = trigger.dataset.action;
      if (action === 'start') {
        const input = document.getElementById('player-name');
        const name = input ? input.value : '';
        const saved = loadSave();
        if (saved && !saved.ended) {
          queueModal({
            kicker: '还有一局未走完',
            title: '要重开吗？',
            body: ['你已经有一局进行到第 ' + saved.day + ' 日。重开会覆盖这局的自动存档。'],
            choices: [
              { label: '继续上一局', sub: '回到第 ' + saved.day + ' 日。', action: () => continueGame() },
              { label: '重开一局', sub: '当前进度会被覆盖。', action: () => startNewGame(name) },
              { label: '再想想' }
            ]
          });
        } else {
          startNewGame(name);
        }
      } else if (action === 'continue') {
        continueGame();
      } else if (action === 'last-ending') {
        const saved = loadSave();
        if (saved && saved.ended) {
          state = saved;
          gameScreen = 'ending';
          render();
        }
      } else if (action === 'gallery') {
        showGallery();
      } else if (action === 'restart') {
        restart();
      } else if (action === 'menu') {
        openMenu();
      } else if (action === 'work') {
        actionWork();
      } else if (action === 'investigate') {
        actionInvestigate();
      } else if (action === 'study') {
        actionStudy();
      } else if (action === 'social') {
        actionSocial();
      } else if (action === 'scheme') {
        actionScheme();
      } else if (action === 'rest') {
        actionRest();
      }
      return;
    }

    const clueEl = event.target.closest('[data-clue]');
    if (clueEl) {
      const id = clueEl.dataset.clue;
      if (id && CLUES[id] && state && state.clues[id]) {
        queueModal({
          kicker: '卷宗 · ' + CLUES[id].label,
          title: CLUES[id].title,
          body: [CLUES[id].text],
          note: '来源：' + CLUES[id].source,
          choices: [{ label: '合上' }]
        });
      }
    }
  });

  /* ---------------- 启动 ---------------- */

  render();

  /* 供本地调试与自动化测试使用；不会影响正常游玩 */
  window.__YUQIAN__ = {
    get state() { return state; },

    actionInvestigate,
    actionSocial,
    actionScheme,
    advance,
    ending,

    clueCount
  };
